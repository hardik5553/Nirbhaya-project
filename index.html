<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="../css/auth.css">
    <link rel="stylesheet" href="../css/global.css">

    <title>NIRBHAYA - Login</title>

    <style>
        /* Login Container */
        .login-container {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Background */
        .auth-page {
            background-image: url("bgg.jpeg");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* Login Card */
        .login-card {
            width: 100%;
            max-width: 450px;
        }

        /* Login Button */
        .login-btn {
            width: 100%;
            padding: 13px;

            margin-top: 20px;

            border: none;
            border-radius: 10px;

            background: #e63946;
            color: white;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;
        }

        .login-btn:hover {
            background: #c92f3d;
        }

        /* Signup text */
        .login-text {
            text-align: center;
            margin-top: 20px;
        }

        .login-text a {
            color: #e63946;
            font-weight: bold;
            text-decoration: none;
        }

        .login-text a:hover {
            text-decoration: underline;
        }

        /* CAPTCHA Modal Styling */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background: rgba(15, 23, 42, 0.7);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-content {
            background: #ffffff;
            color: #1e293b;
            width: 100%;
            max-width: 400px;
            border-radius: 16px;
            padding: 25px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        .modal-content h3 {
            margin-bottom: 10px;
            color: #0f172a;
        }

        .modal-content p {
            font-size: 13px;
            color: #64748b;
            margin-bottom: 20px;
        }

        .captcha-display {
            background: #f1f5f9;
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 5px;
            color: #e63946;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
            user-select: none;
        }

        .modal-input {
            width: 100%;
            padding: 10px 12px;
            margin-bottom: 20px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 15px;
            text-align: center;
            outline: none;
        }

        .modal-input:focus {
            border-color: #e63946;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
        }

        .modal-actions button {
            flex: 1;
            padding: 10px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            border: none;
        }

        .btn-cancel {
            background: #e2e8f0;
            color: #334155;
        }

        .btn-verify {
            background: #16a34a;
            color: white;
        }
    </style>

</head>


<body>

    <main class="auth-page">

        <section class="login-container">

            <!-- NIRBHAYA HEADER -->

            <div class="auth-header">

                <div class="shield-logo">

                    <img src="../assets/images/nirbhaya logo.png" alt="Nirbhaya Logo" class="shield">

                </div>

                <h1>NIRBHAYA</h1>

                <p>
                    Security on your wrist, peace in your mind
                </p>

            </div>


            <!-- LOGIN CARD -->

            <div class="login-card">

                <h2>Welcome Back!</h2>

                <p class="subtitle">
                    Login to continue your safest journey
                </p>


                <!-- EMAIL -->

                <div class="input-group">

                    <label for="email">
                        Email Address
                    </label>

                    <div class="input-wrapper">

                        <span class="input-icon">
                            ✉
                        </span>

                        <input type="email" id="email" placeholder="name@example.com" required>

                    </div>

                </div>


                <!-- PASSWORD -->

                <div class="input-group">

                    <label for="password">
                        Password
                    </label>

                    <div class="input-wrapper">

                        <span class="input-icon">
                            🔒
                        </span>

                        <input type="password" id="password" placeholder="Password" required>

                        <button type="button" class="eye-btn" id="togglePassword">

                            👁

                        </button>

                    </div>

                </div>


                <!-- FORGOT PASSWORD -->

                <div class="login-options">

                    <a href="#" id="forgotPasswordLink" onclick="openCaptchaModal(event)">
                        Forgot Password?
                    </a>

                </div>


                <!-- LOGIN BUTTON -->

                <button type="button" class="login-btn" id="loginBtn" onclick="handleLogin()">

                    Submit

                </button>


                <!-- SIGN UP -->

                <p class="login-text">

                    Don't have an account?

                    <a href="signup.html">
                        Sign Up
                    </a>

                </p>

            </div>

        </section>

    </main>


    <!-- CAPTCHA VERIFICATION MODAL FOR FORGOT PASSWORD -->
    <div class="modal-overlay" id="captchaModal">
        <div class="modal-content">
            <h3>🔐 Security Verification</h3>
            <p>Please solve the CAPTCHA below to securely recover your account and log in.</p>

            <div class="captcha-display" id="captchaCodeText">7492</div>

            <input type="text" id="captchaUserInput" class="modal-input" placeholder="Enter the code above"
                autocomplete="off">

            <div class="modal-actions">
                <button class="btn-cancel" onclick="closeCaptchaModal()">Cancel</button>
                <button class="btn-verify" onclick="verifyAndLogin()">Verify & Login</button>
            </div>
        </div>
    </div>


    <!-- Script for Official Validation & Isolated Authentication -->
    <script>
        // Password Visibility Toggle
        const togglePassword = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');

        if (togglePassword && passwordInput) {
            togglePassword.addEventListener('click', function () {
                const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                passwordInput.setAttribute('type', type);
                this.style.opacity = type === 'text' ? '1' : '0.6';
            });
        }

        // Official Login Action with Strict Validation
        function handleLogin() {
            const emailInput = document.getElementById('email');
            const passwordInput = document.getElementById('password');

            const email = emailInput.value.trim().toLowerCase();
            const password = passwordInput.value.trim();

            // Official Validation 1: Empty Fields
            if (!email || !password) {
                alert("⚠️ Please enter both email and password.");
                return;
            }

            // Official Validation 2: Strict Email Format Check (Must contain '@' and '.')
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email)) {
                alert("❌ Invalid Email Format! Please enter a valid email address containing '@' (e.g., user@example.com).");
                emailInput.focus();
                return;
            }

            // Retrieve registered users database from localStorage
            let users = JSON.parse(localStorage.getItem('nirbhaya_signup_users')) || [];

            // Find user matching email and password
            const foundUser = users.find(u => u.email.toLowerCase() === email && u.password === password);

            if (!foundUser) {
                alert("❌ Authentication Failed: Account not found or incorrect credentials!\n\nPlease check your email/password or sign up first.");
                return;
            }

            // Set current active session user parameters (Isolated profiles)
            localStorage.setItem('nirbhaya_current_user_email', foundUser.email);
            localStorage.setItem('nirbhaya_username', foundUser.name);
            if (foundUser.dp) {
                localStorage.setItem('nirbhaya_userdp', foundUser.dp);
            } else {
                localStorage.removeItem('nirbhaya_userdp');
            }

            alert(`✅ Welcome back, ${foundUser.name}!\n\nLogin Successful. Redirecting to Dashboard...`);
            window.location.href = "../security.html";
        }

        // Forgot Password CAPTCHA Modal Logic
        let generatedCaptcha = "";

        function openCaptchaModal(event) {
            event.preventDefault();

            const email = document.getElementById('email').value.trim().toLowerCase();
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

            if (!email || !emailRegex.test(email)) {
                alert("⚠️ Please enter a valid email address first to recover your password.");
                document.getElementById('email').focus();
                return;
            }

            let users = JSON.parse(localStorage.getItem('nirbhaya_signup_users')) || [];
            const userExists = users.some(u => u.email.toLowerCase() === email);

            if (!userExists) {
                alert("❌ No account found with this email address. Please sign up first.");
                return;
            }

            generatedCaptcha = Math.floor(1000 + Math.random() * 9000).toString();
            document.getElementById('captchaCodeText').textContent = generatedCaptcha;
            document.getElementById('captchaUserInput').value = "";

            document.getElementById('captchaModal').style.display = 'flex';
        }

        function closeCaptchaModal() {
            document.getElementById('captchaModal').style.display = 'none';
        }

        function verifyAndLogin() {
            const userInputValue = document.getElementById('captchaUserInput').value.trim();
            const email = document.getElementById('email').value.trim().toLowerCase();

            if (!userInputValue) {
                alert("⚠️ Please enter the verification code.");
                return;
            }

            if (userInputValue === generatedCaptcha) {
                let users = JSON.parse(localStorage.getItem('nirbhaya_signup_users')) || [];
                const foundUser = users.find(u => u.email.toLowerCase() === email);

                if (foundUser) {
                    localStorage.setItem('nirbhaya_current_user_email', foundUser.email);
                    localStorage.setItem('nirbhaya_username', foundUser.name);
                    if (foundUser.dp) {
                        localStorage.setItem('nirbhaya_userdp', foundUser.dp);
                    }
                }

                alert("🔓 CAPTCHA Verified Successfully!\n\nYour account has been verified. Logging you in automatically...");
                closeCaptchaModal();
                window.location.href = "../security.html";
            } else {
                alert("❌ Incorrect verification code. Please try again.");
                generatedCaptcha = Math.floor(1000 + Math.random() * 9000).toString();
                document.getElementById('captchaCodeText').textContent = generatedCaptcha;
                document.getElementById('captchaUserInput').value = "";
            }
        }
    </script>

</body>

</html>
