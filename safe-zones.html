<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NIRBHAYA - Safe Zones</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background: #d2b185;
            min-height: 100vh;
            padding: 30px 20px;
        }

        .safe-zone-page {
            max-width: 535px;
            margin: auto;
            background: white;
            border-radius: 22px;
            padding: 28px;
        }

        /* Header */

        .page-header {
            display: flex;
            align-items: center;
            gap: 15px;
            padding-bottom: 20px;
            border-bottom: 1px solid #e5e9ef;
        }

        .back-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: none;
            background: #eef6ff;
            color: #2563eb;
            font-size: 22px;
            cursor: pointer;
        }

        .page-header h1 {
            font-size: 23px;
            color: #111;
        }

        /* Current Location */

        .current-location {
            margin-top: 20px;
            padding: 18px;
            background: #d8f9e4;
            border-radius: 14px;
        }

        .current-location h2 {
            font-size: 20px;
            margin-bottom: 7px;
        }

        .current-location p {
            font-size: 16px;
            color: #333;
        }

        .safe-status {
            display: inline-block;
            margin-top: 12px;
            background: #16a34a;
            color: white;
            padding: 7px 15px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 14px;
        }

        /* Map */

        .map-container {
            margin-top: 20px;
            height: 250px;
            border-radius: 15px;
            overflow: hidden;
            background: #e8f0e8;
            position: relative;
        }

        .map {
            width: 100%;
            height: 100%;
            background:
                linear-gradient(45deg,
                    #e4eadf 25%,
                    transparent 25%,
                    transparent 75%,
                    #e4eadf 75%),
                linear-gradient(45deg,
                    #e4eadf 25%,
                    transparent 25%,
                    transparent 75%,
                    #e4eadf 75%);
            background-size: 80px 80px;
            background-position: 0 0, 40px 40px;
            position: relative;
        }

        /* Roads */

        .road1,
        .road2,
        .road3 {
            position: absolute;
            background: white;
        }

        .road1 {
            width: 100%;
            height: 16px;
            top: 45%;
            transform: rotate(-8deg);
        }

        .road2 {
            width: 16px;
            height: 100%;
            left: 48%;
            transform: rotate(18deg);
        }

        .road3 {
            width: 100%;
            height: 10px;
            top: 72%;
            transform: rotate(5deg);
        }

        /* Location Marker */

        .location-marker {
            position: absolute;
            top: 48%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 45px;
            height: 45px;
            background: #16a34a;
            border-radius: 50% 50% 50% 0;
            transform: translate(-50%, -50%) rotate(-45deg);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .location-marker span {
            transform: rotate(45deg);
            color: white;
            font-size: 20px;
        }

        /* Safe Zone List */

        .section-title {
            margin-top: 25px;
            margin-bottom: 12px;
            font-size: 20px;
        }

        .zone {
            display: flex;
            align-items: center;
            padding: 15px;
            border: 1px solid #e3e7ec;
            border-radius: 12px;
            margin-bottom: 12px;
        }

        .zone-icon {
            width: 42px;
            height: 42px;
            background: #e8f8ed;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            margin-right: 13px;
        }

        .zone-info {
            flex: 1;
        }

        .zone-info h3 {
            font-size: 17px;
            margin-bottom: 4px;
        }

        .zone-info p {
            font-size: 14px;
            color: #666;
        }

        .distance {
            color: #16a34a;
            font-weight: bold;
            font-size: 14px;
        }

        /* Route Button */

        .route-btn {
            width: 100%;
            height: 52px;
            margin-top: 10px;

            border: 1.5px solid #ff6b21;
            background: white;
            color: #ff6b21;

            border-radius: 11px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        .route-btn:hover {
            background: #fff5ef;
        }

        /* Mobile */

        @media (max-width: 600px) {

            body {
                padding: 20px 15px;
            }

            .safe-zone-page {
                padding: 22px;
            }

            .page-header h1 {
                font-size: 20px;
            }

            .map-container {
                height: 220px;
            }
        }
    </style>
</head>

<body>

    <div class="safe-zone-page">

        <!-- Header -->

        <div class="page-header">

            <button class="back-btn" onclick="window.history.back()">
                ←
            </button>

            <h1>Safe Zones</h1>

        </div>


        <!-- Current Location -->

        <div class="current-location">

            <h2>📍 Current Location</h2>

            <p>
                You are currently in a safe area.
            </p>

            <span class="safe-status">
                SAFE
            </span>

        </div>


        <!-- Map -->

        <div class="map-container">

            <div class="map">

                <div class="road1"></div>
                <div class="road2"></div>
                <div class="road3"></div>

                <div class="location-marker">
                    <span>●</span>
                </div>

            </div>

        </div>


        <!-- Nearby Safe Zones -->

        <h2 class="section-title">
            Nearby Safe Zones
        </h2>


        <div class="zone">

            <div class="zone-icon">
                🏥
            </div>

            <div class="zone-info">
                <h3>Nearest Hospital</h3>
                <p>24×7 Emergency Support</p>
            </div>

            <div class="distance">
                0.8 km
            </div>

        </div>


        <div class="zone">

            <div class="zone-icon">
                🚓
            </div>

            <div class="zone-info">
                <h3>Police Station</h3>
                <p>Emergency Assistance</p>
            </div>

            <div class="distance">
                1.2 km
            </div>

        </div>


        <div class="zone">

            <div class="zone-icon">
                🏢
            </div>

            <div class="zone-info">
                <h3>Public Help Center</h3>
                <p>Safe public location</p>
            </div>

            <div class="distance">
                1.5 km
            </div>

        </div>


        <!-- Route -->

        <button class="route-btn" onclick="openRoute()">
            🧭 Get Safe Route
        </button>

    </div>


    <script>

        function openRoute() {

            alert("Safe route will be shown here.");

        }

    </script>

</body>

</html>
